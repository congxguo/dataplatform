apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest-catalog
  namespace: iceberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iceberg-rest-catalog
  template:
    metadata:
      labels:
        app: iceberg-rest-catalog
    spec:
      containers:
      - name: catalog
        image: apache/iceberg-rest-fixture:latest
        ports:
        - containerPort: 8181
        env:
        - name: CATALOG_WAREHOUSE
          value: "s3://iceberg-warehouse"
        - name: CATALOG_IO__IMPL
          value: "org.apache.iceberg.aws.s3.S3FileIO"
        - name: AWS_ACCESS_KEY_ID
          value: "minioadmin"
        - name: AWS_SECRET_ACCESS_KEY
          value: "minioadmin"
        - name: AWS_REGION
          value: "us-east-1"
        - name: CATALOG_S3_REGION
          value: "us-east-1"
        - name: CATALOG_S3_ACCESS_KEY_ID
          value: "minioadmin"
        - name: CATALOG_S3_SECRET_ACCESS_KEY
          value: "minioadmin"
        - name: CATALOG_S3_PATH__STYLE__ACCESS
          value: "true"
        - name: CATALOG_S3_PATH_STYLE_ACCESS
          value: "true"
        - name: CATALOG_S3_ENDPOINT
          value: "http://minio.minio.svc.cluster.local:9000"
        - name: ICEBERG_S3_PATH_STYLE_ACCESS
          value: "true"
        - name: ICEBERG_S3_ENDPOINT
          value: "http://minio.minio.svc.cluster.local:9000"
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest-catalog
  namespace: iceberg
spec:
  type: NodePort
  ports:
    - port: 8181
      targetPort: 8181
      nodePort: 30181
  selector:
    app: iceberg-rest-catalog

