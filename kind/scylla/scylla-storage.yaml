    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-no
          operator: In
          values:
          - "2"
---
# PersistentVolume pointing to /mnt/data/scylla
apiVersion: v1
kind: PersistentVolume
metadata:
