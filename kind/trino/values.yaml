coordinator:
  persistence:
    enabled: true
    size: 20Gi
    storageClass: trino-storage

server:
  workers: 2

worker:
  persistence:
    enabled: true
    size: 20Gi
    storageClass: trino-storage

additionalCatalogs:
  iceberg_catalog: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://iceberg-rest-catalog.iceberg.svc.cluster.local:8181
    iceberg.rest-catalog.warehouse=s3://iceberg-warehouse

    # MinIO S3 config — this is what's missing
    fs.native-s3.enabled=true
    s3.endpoint=http://minio.minio.svc.cluster.local:9000
    s3.path-style-access=true
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin
    s3.region=us-east-1
